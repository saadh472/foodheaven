<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Food Heaven</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        background-image: url("Background.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .container {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(15px);
        border-radius: 20px;
        padding: 35px 45px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
        animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        transform-origin: center;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .container:hover {
        transform: translateY(-5px);
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.2);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.9) translateY(20px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .container h1 {
        text-align: center;
        margin-bottom: 20px;
        font-weight: 600;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        font-weight: 400;
        margin-bottom: 5px;
      }

      .form-group input {
        width: 100%;
        padding: 14px 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        outline: none;
        font-size: 15px;
        background: rgba(255, 255, 255, 0.25);
        color: #fff;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .form-group input::placeholder {
        color: rgba(255, 255, 255, 0.7);
      }

      .form-group input:focus {
        border-color: rgba(255, 255, 255, 0.6);
        background: rgba(255, 255, 255, 0.35);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        transform: translateY(-2px);
      }

      .form-group input[type="submit"] {
        background: linear-gradient(135deg, #4caf50, #66bb6a);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: none;
        box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        position: relative;
        overflow: hidden;
      }

      .form-group input[type="submit"]::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition: width 0.6s ease, height 0.6s ease;
      }

      .form-group input[type="submit"]:hover::before {
        width: 400px;
        height: 400px;
      }

      .form-group input[type="submit"]:hover {
        background: linear-gradient(135deg, #66bb6a, #81c784);
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(76, 175, 80, 0.5);
      }

      .form-group input[type="submit"]:active {
        transform: translateY(0);
      }

      .back-link {
        text-align: center;
        margin-top: 20px;
      }

      .back-link a {
        color: #ffd1c1;
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: inline-block;
        position: relative;
      }

      .back-link a::after {
        content: '';
        position: absolute;
        bottom: -3px;
        left: 0;
        width: 0;
        height: 2px;
        background: #fff;
        transition: width 0.3s ease;
      }

      .back-link a:hover {
        color: #fff;
        transform: translateY(-2px);
      }

      .back-link a:hover::after {
        width: 100%;
      }

      .logo {
        text-align: center;
        margin-bottom: 20px;
      }

      .logo img {
        max-width: 110px;
        border-radius: 50%;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        transition: transform 0.3s ease;
      }

      .logo img:hover {
        transform: scale(1.1) rotate(5deg);
      }

      /* Responsiveness */
      @media (max-width: 768px) {
        .container {
          width: 90%;
        }
      }
    </style>
      <script src="/app.js"></script>
      <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="app-page auth-page"><main class="container">
  <div class="logo"><img src="Logo.png" alt="FoodHeaven"></div>
  <h1>Password settings</h1>
  <p style="line-height:1.8">Sign in and verify your current password to choose a new password.</p>
  <p><a href="../Canvas/Canvas_changepassword.html">Open password settings</a></p>
  <p><a href="Portal%20Page.html">Back to sign in</a></p>
</main></body></html>
