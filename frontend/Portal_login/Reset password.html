<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Food Heaven</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s ease;
            transform-origin: center;
            transition: transform 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .container h1 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 400;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid transparent;
            border-radius: 5px;
            outline: none;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.25);
        }

        .form-group input[type="submit"] {
            background: #4caf50;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            border: none;
        }

        .form-group input[type="submit"]:hover {
            background: #388e3c;
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
        }

        .back-link a {
            color: #ffd1c1;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #fff;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            max-width: 100px;
            border-radius: 50%;
        }

        /* Responsiveness */
        @media (max-width: 768px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="Logo.png" alt="Reset Password Logo">
        </div>
        <h1>Reset Password Preview</h1>
        <p>Use sample values to preview validation. Nothing is saved.</p>
        <form id="reset-password-form" action="#" method="POST">
            <div class="form-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" name="new-password" placeholder="Enter new password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm new password" required>
            </div>
            <div class="form-group">
                <input type="submit" value="Update Password" id="submit-button">
            </div>
            <p id="error-message" style="color: red; text-align: center; display: none;">Passwords do not match. Please try again.</p>
        </form>
        <div class="back-link">
            <a href="Portal Page.html">Back to Login</a>
        </div>
    </div>

    <script>
        const newPasswordInput = document.getElementById('new-password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const submitButton = document.getElementById('submit-button');
        const errorMessage = document.getElementById('error-message');

        // Function to validate if passwords match
        function validatePasswords() {
            if (newPasswordInput.value === confirmPasswordInput.value && newPasswordInput.value !== '') {
                submitButton.disabled = false;
                errorMessage.style.display = 'none';  // Hide the error message if passwords match
            } else {
                submitButton.disabled = true;
                if (newPasswordInput.value && confirmPasswordInput.value) {
                    errorMessage.style.display = 'block'; // Show the error message if passwords don't match
                } else {
                    errorMessage.style.display = 'none'; // Hide error if both fields are empty
                }
            }
        }

        // Handle form submission to prevent submission when passwords don't match
        function handleSubmit(event) {
            event.preventDefault();
            if (newPasswordInput.value !== confirmPasswordInput.value) {
                event.preventDefault();  // Prevent form submission
                errorMessage.style.display = 'block';  // Show the error message
            } else {
                errorMessage.textContent = 'Validation passed. This preview does not update an account.';
                errorMessage.style.display = 'block';
            }
        }

        // Add event listeners for real-time validation
        newPasswordInput.addEventListener('input', validatePasswords);
        confirmPasswordInput.addEventListener('input', validatePasswords);
        document.getElementById('reset-password-form').addEventListener('submit', handleSubmit);
    </script>
</body>
</html>
