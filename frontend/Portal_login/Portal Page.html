<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | FoodHeaven</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js"></script>
</head>
<body class="app-page auth-page">
  <main class="container">
    <div class="logo"><img src="Logo.png" alt="FoodHeaven" width="72" height="72"></div>
    <h1>Sign in to FoodHeaven</h1>
    <form id="loginForm" action="#" method="post" novalidate>
      <div class="form-group">
        <label for="employee-id">Manager login ID</label>
        <input type="text" id="employee-id" name="employee-id" inputmode="numeric" pattern="[0-9]{1,10}" maxlength="10" autocomplete="username" aria-describedby="loginIdHelp" value="1001" required>
        <p id="loginIdHelp" class="field-hint">Manager IDs use numbers. The local demo ID is 1001.</p>
      </div>
      <div class="form-group">
        <div class="login-label-row">
          <label for="password">Password</label>
          <button type="button" id="toggle-password" class="password-reveal-button" aria-controls="password" aria-pressed="false">Show</button>
        </div>
        <input type="password" id="password" name="password" autocomplete="current-password" value="DemoPass123!" required>
      </div>
      <div class="form-group"><input type="submit" id="loginSubmit" value="Sign in"></div>
      <p id="loginStatus" role="status" aria-live="polite" aria-atomic="true"></p>
    </form>
    <section class="demo-account" aria-label="Local testing account">
      <strong>Local demo</strong>
      <p>Login ID <strong>1001</strong> · Password <strong>DemoPass123!</strong></p>
      <button type="button" id="useDemoAccount" class="demo-fill-button">Use demo account</button>
    </section>
    <div class="additional-links"><a href="Forget password.html">Account help</a></div>
  </main>
  <script>
(() => {
  const form = document.getElementById('loginForm');
  const loginId = document.getElementById('employee-id');
  const password = document.getElementById('password');
  const submit = document.getElementById('loginSubmit');
  const fillDemo = document.getElementById('useDemoAccount');
  const reveal = document.getElementById('toggle-password');
  const status = document.getElementById('loginStatus');
  let submitting = false;
  let signedIn = false;

  function setStatus(message, kind = 'info') {
    status.textContent = message;
    status.dataset.kind = kind;
  }
  function setBusy(busy) {
    form.setAttribute('aria-busy', String(busy));
    for (const control of [loginId, password, submit, fillDemo]) control.disabled = busy;
    submit.value = busy ? 'Signing in…' : 'Sign in';
  }
  function setPasswordVisible(visible) {
    password.type = visible ? 'text' : 'password';
    reveal.textContent = visible ? 'Hide' : 'Show';
    reveal.setAttribute('aria-pressed', String(visible));
    reveal.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
  }

  reveal.addEventListener('click', () => setPasswordVisible(password.type === 'password'));
  fillDemo.addEventListener('click', () => {
    if (submitting) return;
    loginId.value = '1001';
    password.value = 'DemoPass123!';
    loginId.removeAttribute('aria-invalid');
    password.removeAttribute('aria-invalid');
    setPasswordVisible(false);
    setStatus('Demo account filled. Choose Sign in to continue.');
    submit.focus();
  });
  for (const input of [loginId, password]) input.addEventListener('input', () => {
    input.removeAttribute('aria-invalid');
    if (!submitting) setStatus('');
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (submitting) return;
    const id = loginId.value.trim();
    if (!/^[0-9]{1,10}$/.test(id) || Number(id) < 1 || Number(id) > 2147483647) {
      loginId.setAttribute('aria-invalid', 'true');
      setStatus('Enter a numeric manager ID between 1 and 2147483647. Use 1001 for the local demo.', 'error');
      loginId.focus();
      return;
    }
    if (!password.value) {
      password.setAttribute('aria-invalid', 'true');
      setStatus('Enter your password, or choose Use demo account.', 'error');
      password.focus();
      return;
    }
    const payload = { LoginID: Number(id), Password: password.value };
    submitting = true;
    setBusy(true);
    setStatus('Signing in…');
    try {
      const response = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Sign in failed. Check the account details and retry.');
      signedIn = true;
      setStatus('Signed in. Opening your workspace…', 'success');
      location.assign('../interface.html');
    } catch (error) {
      setStatus(error.message || 'Could not sign in. Check the local server and retry.', 'error');
    } finally {
      if (!signedIn) { submitting = false; setBusy(false); }
    }
  });
})();
  </script>
</body>
</html>
