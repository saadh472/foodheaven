    <script>
      let shiftData = [];
      let filteredShiftData = [];
      let currentPage = 1;
      const recordsPerPage = 10;
      let currentEmployeeId = -1;
      let currentEmployeeName = "";

      // Predefined shift times
      const SHIFT_TIMES = {
        'Morning': { start: '09:00:00', end: '17:00:00', name: 'Morning' },
        'Evening': { start: '17:00:00', end: '01:00:00', name: 'Evening' }, // End time is next day
        'Night': { start: '01:00:00', end: '09:00:00', name: 'Night' }
      };

      // Function to create SQL datetime string from shift type
      function createShiftDateTime(shiftType, isEndTime = false) {
        if (!SHIFT_TIMES[shiftType]) return null;

        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');

        let time = SHIFT_TIMES[shiftType].start;
        if (isEndTime) {
          time = SHIFT_TIMES[shiftType].end;
          // Only a shift whose end clock time precedes its start crosses midnight
          if (SHIFT_TIMES[shiftType].end <= SHIFT_TIMES[shiftType].start) {
            const nextDay = new Date(today);
            nextDay.setDate(nextDay.getDate() + 1);
            const nextYear = nextDay.getFullYear();
            const nextMonth = String(nextDay.getMonth() + 1).padStart(2, '0');
            const nextDayNum = String(nextDay.getDate()).padStart(2, '0');
            return `${nextYear}-${nextMonth}-${nextDayNum} ${time}`;
          }
        }

        return `${year}-${month}-${day} ${time}`;
      }

      // Helper function to escape HTML and prevent XSS
      function escapeHtml(text) {
        if (text == null) return '';
        const map = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        };
        return String(text).replace(/[&<>"']/g, m => map[m]);
      }

      // Helper function to safely get element by ID
      function getElementSafely(id) {
        const element = document.getElementById(id);
        if (!element) {
        }
        return element;
      }

      // Function to display shift data
      function displayShifts(data) {
  const tableBody = document.querySelector('#shiftTable tbody'); tableBody.replaceChildren();
  if (!Array.isArray(data)) data = [];
  for (const record of data.slice((currentPage - 1) * recordsPerPage, currentPage * recordsPerPage)) {
    const row = document.createElement('tr');
    const start = record.StartTime ? convertDateToTime(record.StartTime) : 'No Shift';
    const end = record.EndTime ? convertDateToTime(record.EndTime) : 'No Shift';
    const hasShift = Boolean(record.StartTime && record.EndTime);
    [record.EmployeeName, record.ShiftName || 'Not Assigned', start, end].forEach(value => FoodHeaven.cell(row, value));
    const actions = FoodHeaven.cell(row, ''); const button = document.createElement('button'); button.type = 'button';
    button.textContent = hasShift ? 'Edit' : 'Assign Shift';
    button.addEventListener('click', () => editShift(String(record.EmployeeID), start, end, String(record.EmployeeName || '')));
    actions.appendChild(button); tableBody.appendChild(row);
  }
  const totalPages = Math.ceil(data.length / recordsPerPage);
  document.getElementById('pageNum').textContent = 'Page ' + (totalPages ? currentPage : 0) + ' of ' + totalPages;
  document.getElementById('prevPage').disabled = currentPage <= 1;
  document.getElementById('nextPage').disabled = currentPage >= totalPages;
}
      function convertDateToTime(value) {
  const match = String(value || '').match(/(?:T| |^)([0-2]\d):([0-5]\d)/);
  if (!match) return 'No Shift';
  const hour = Number(match[1]);
  return String(hour % 12 || 12).padStart(2, '0') + ':' + match[2] + (hour >= 12 ? ' PM' : ' AM');
}

      async function fetchShifts() {
        try {
          const response = await fetch("/shift/get/");
          if (!response.ok) {
            const errorData = await response.json().catch(() => ({ error: `HTTP ${response.status}: ${response.statusText}` }));
            throw new Error(errorData.error || `Failed to fetch shifts: ${response.status}`);
          }
          const data = await response.json();
          if (!Array.isArray(data)) {
            throw new Error("Invalid data format received from server");
          }
          shiftData = data;
          filteredShiftData = data;
          displayShifts(filteredShiftData);
        } catch (error) {
          alert("Error fetching shift data: " + error.message);
          displayShifts([]);
        }
      }

      window.addEventListener('load', () => {
        try {
          fetchShifts();
        } catch (error) {
        }
      });

      // Function to search employee shift by ID or Name (case-insensitive)
      function searchShift() {
        try {
          const searchInput = getElementSafely("employeeName");
          if (!searchInput) return;

          const searchQuery = searchInput.value.trim();

          // If search is empty, show all records
          if (!searchQuery) {
            filteredShiftData = shiftData;
            currentPage = 1;
            displayShifts(filteredShiftData);
            return;
          }

          // Case-insensitive search by ID or Name
          const searchLower = searchQuery.toLowerCase();
          filteredShiftData = shiftData.filter((record) => {
            try {
              const empId = record.EmployeeID ? String(record.EmployeeID).toLowerCase() : '';
              const empName = record.EmployeeName ? String(record.EmployeeName).toLowerCase() : '';
              return empId.includes(searchLower) || empName.includes(searchLower);
            } catch (err) {
              return false;
            }
          });

          currentPage = 1; // Reset to first page when searching
          displayShifts(filteredShiftData);
        } catch (error) {
        }
      }

      function clearSearch() {
        try {
          const searchInput = getElementSafely("employeeName");
          if (searchInput) searchInput.value = '';
          filteredShiftData = shiftData;
          currentPage = 1;
          displayShifts(filteredShiftData);
        } catch (error) {
        }
      }

      // Function to convert AM/PM time to 24-hour format for comparison
      function convertTo24Hour(timeStr) {
        if (!timeStr || timeStr === 'No Shift') return null;

        // Remove AM/PM and extract time
        const timePart = timeStr.replace(/\s*(AM|PM)/i, '');
        const [hours, minutes] = timePart.split(':').map(Number);
        const isPM = /PM/i.test(timeStr);

        if (isNaN(hours) || isNaN(minutes)) return null;

        // Convert to 24-hour format
        let hours24 = hours;
        if (isPM && hours !== 12) {
          hours24 = hours + 12;
        } else if (!isPM && hours === 12) {
          hours24 = 0;
        }

        return `${hours24.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
      }

      // Function to get shift name from times
      function getShiftNameFromTimes(startTime, endTime) {
        if (!startTime || !endTime || startTime === 'No Shift' || endTime === 'No Shift') {
          return null;
        }

        // Convert AM/PM times to 24-hour format for comparison
        const start24 = convertTo24Hour(startTime);
        const end24 = convertTo24Hour(endTime);

        if (!start24) return null;

        // Check against predefined shifts
        for (const [shiftName, shiftData] of Object.entries(SHIFT_TIMES)) {
          const shiftStart = shiftData.start.substring(0, 5); // Get HH:mm (09:00)
          const shiftEnd = shiftData.end.substring(0, 5); // Get HH:mm

          // Handle morning shift (9am-5pm = 09:00-17:00)
          if (shiftName === 'Morning' && start24 === shiftStart && end24 === shiftEnd) {
            return shiftName;
          }
          // Handle evening shift (5pm-1am = 17:00-01:00) - check start time only since end is next day
          else if (shiftName === 'Evening' && start24 === shiftStart) {
            return shiftName;
          }
          // Handle night shift (1am-9am = 01:00-09:00) - check start time only since end is next day
          else if (shiftName === 'Night' && start24 === shiftStart) {
            return shiftName;
          }
        }

        return null; // Unknown shift
      }

      // Function to edit shift
      function editShift(empId, startTime, endTime, empName) {
        try {
          const currentEmployeeNameEl = getElementSafely("currentEmployeeName");
          const shiftTypeEl = getElementSafely("shiftType");

          if (!currentEmployeeNameEl) {
            alert("Form element not found. Please refresh the page.");
            return;
          }

          if (!shiftTypeEl) {
            alert("Shift selection dropdown not found. Please refresh the page.");
            return;
          }

          currentEmployeeNameEl.value = String(empName || '');
          currentEmployeeId = String(empId || '');

          // Determine current shift name from times
          const currentShiftName = getShiftNameFromTimes(startTime, endTime);
          if (currentShiftName) {
            shiftTypeEl.value = currentShiftName;
          } else {
            shiftTypeEl.value = ''; // No shift assigned
          }

          scrollToForm();
        } catch (error) {
          alert("Error loading shift data for editing: " + error.message);
        }
      }

      function convertTimeStringToInputTagCompatible(timeString) {
        try {
          if (!timeString || timeString === 'No Shift') return '';
          // Extract time from format like "06:00 GMT" or "06:00:00"
          const timePart = String(timeString).split(" ")[0];
          // Return in HH:mm format for time input
          return timePart.substring(0, 5); // Take first 5 chars (HH:mm)
        } catch (error) {
          return '';
        }
      }

      function convertTimeToSQLDateTime(timeString, sqlString) {
        // Extract parts from "Mon, 01 Jan 1900 06:00:00 GMT"
        const parts = sqlString.split(" ");
        const dayOfMonth = parts[1]; // "01"
        const month = parts[2]; // "Jan"
        const year = parts[3]; // "1900"

        // Convert month abbreviation (Jan, Feb, etc.) to numerical month (01, 02, etc.)
        const monthMap = {
          Jan: "01",
          Feb: "02",
          Mar: "03",
          Apr: "04",
          May: "05",
          Jun: "06",
          Jul: "07",
          Aug: "08",
          Sep: "09",
          Oct: "10",
          Nov: "11",
          Dec: "12",
        };

        const numericMonth = monthMap[month]; // Get the numeric value of the month

        // Construct the date in the format YYYY-MM-DD
        const datePart = `${year}-${numericMonth}-${dayOfMonth}`;

        // Construct the final datetime string (append the time with seconds)
        const formattedDateTime = `${datePart} ${timeString}:00`; // HH:mm:00 format

        return formattedDateTime; // Example: "1900-01-01 06:00:00"
      }

      // Function to change shift time
      async function changeShiftTime() {
        try {
          if (currentEmployeeId == -1 || !currentEmployeeId) {
            alert("Select an Employee for Assigning/Updating Shift!");
            return;
          }

          const shiftTypeEl = getElementSafely("shiftType");

          if (!shiftTypeEl) {
            alert("Shift selection not found");
            return;
          }

          const shiftType = shiftTypeEl.value.trim();

          if (!shiftType) {
            alert("Please select a shift type (Morning, Evening, or Night)");
            return;
          }

          if (!SHIFT_TIMES[shiftType]) {
            alert("Invalid shift type selected");
            return;
          }

          const emp = shiftData.find((e) => String(e.EmployeeID) === String(currentEmployeeId));
          if (!emp) {
            alert("Employee not found");
            return;
          }

          // Create datetime strings for the selected shift
          const finalStartTime = createShiftDateTime(shiftType, false);
          const finalEndTime = createShiftDateTime(shiftType, true);

          if (!finalStartTime || !finalEndTime) {
            alert("Error creating shift times");
            return;
          }

        // Create the data object to send in the request body
        const data = {
          EmployeeID: Number(emp.EmployeeID),
          StartTime: finalStartTime,
          EndTime: finalEndTime,
          ShiftName: shiftType  // Include shift name (Morning, Evening, or Night)
        };

        try {
          // Send a PUT request to the Flask API
          const response = await fetch("/shift/update/", {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          // Handle the response from the API
          if (response.ok) {
            const result = await response.json();
            alert(result.message || "Shift updated successfully.");
            // Optionally, you can reload or refresh the shift data here
            fetchShifts();
            clearForm();
          } else {
            const errorData = await response.json().catch(() => ({ error: `HTTP ${response.status}: ${response.statusText}` }));
            alert(errorData.error || "Failed to update shift.");
          }
        } catch (error) {
          alert("An error occurred while updating the shift: " + error.message);
        }
        } catch (error) {
          alert("An error occurred: " + error.message);
        }
      }
      function clearForm() {
        currentEmployeeId = -1;
        const currentEmployeeName = document.getElementById("currentEmployeeName");
        const shiftType = document.getElementById("shiftType");
        if (currentEmployeeName) currentEmployeeName.value = "";
        if (shiftType) shiftType.value = "";
        // Note: startTime and endTime inputs were removed, replaced with shiftType dropdown
        scrollToTop();
      }
      function changePage(direction) {
        try {
          if (!Array.isArray(filteredShiftData)) {
            return;
          }

          const totalPages = Math.max(1, Math.ceil(filteredShiftData.length / recordsPerPage));

          if (direction === "next" && currentPage < totalPages) {
            currentPage++;
          } else if (direction === "prev" && currentPage > 1) {
            currentPage--;
          }
          displayShifts(filteredShiftData);
        } catch (error) {
        }
      }
      function scrollToTop() {
        const formContainer = document.querySelector(".container");
        formContainer.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      function scrollToForm() {
        const formContainer = document.querySelector(".form-container");
        if (formContainer) {
          formContainer.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }

      // Theme Toggle
      function toggleTheme() {
        document.body.classList.toggle('dark-theme');
        const themeBtn = document.querySelector('.theme-toggle');
        if (themeBtn) {
          themeBtn.textContent = document.body.classList.contains('dark-theme') ? '☀️' : '🌙';
        }
        localStorage.setItem('theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
      }

      // Load saved theme on page load
      function loadTheme() {
        if (localStorage.getItem('theme') === 'dark') {
          document.body.classList.add('dark-theme');
          const themeBtn = document.querySelector('.theme-toggle');
          if (themeBtn) {
            themeBtn.textContent = '☀️';
          }
        }
      }

      // Load theme when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadTheme);
      } else {
        loadTheme();
      }
    </script>
    <!-- Theme Toggle Button -->
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark Mode">🌙</button>
